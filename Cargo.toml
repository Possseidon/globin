[package]
name = "globin"
description = "Global interning across all threads"
keywords = ["interning", "interner", "flyweight", "deduplication", "memory"]
categories = [
    "caching",
    "concurrency",
    "data-structures",
    "memory-management",
    "rust-patterns",
]
version = "0.1.0"
edition = "2024"
authors = ["Possseidon <xpossseidon@gmail.com>"]
repository = "https://github.com/Possseidon/globin"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
ahash = "0.8.12"
indexmap = "2.14.2"
serde_core = { version = "1.0.229", optional = true, features = ["rc"] }

[features]
serde = ["dep:serde_core"]

[dev-dependencies]
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = "1.0.154"

[[example]]
name = "serde"
required-features = ["serde"]

[[example]]
name = "serde_erased"
required-features = ["serde"]

[lints.rust]
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
cargo = "warn"
nursery = "warn"
pedantic = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
default_trait_access = { level = "allow", priority = 1 }
